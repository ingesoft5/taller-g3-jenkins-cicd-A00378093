server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Fallback SPA: si la ruta no corresponde a un archivo o carpeta real,
        # se entrega index.html y React resuelve la ruta en el navegador.
        try_files $uri $uri/ /index.html;
    }

    # Cache agresiva para assets con hash de contenido (Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
