# =============================================================================
# Taller Evaluativo 2 - Despliegue de StudyTrack (backend + frontend)
#
# Este stack es el que el Jenkinsfile ejecuta en su etapa "Deploy & Smoke
# Test" (Fase 4), usando las imágenes que la etapa "Publish to Nexus"
# acaba de publicar en su Docker Registry hosted.
#
# Complete los TODOs: red compartida, healthcheck del backend y la
# condición de arranque del frontend.
# =============================================================================
version: "3.9"

services:
  backend:
    # Imagen inmutable desde Nexus: sin tag explícito el despliegue falla (nunca :latest)
    image: ${NEXUS_REGISTRY:-localhost:9080}/studytrack-api:${IMAGE_TAG:?Debe definir IMAGE_TAG}
    container_name: studytrack-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - product-network
      - cicd_network   # para que Jenkins pueda hacer el smoke test por DNS (studytrack-api:8080)
    healthcheck:
      # La imagen alpine trae wget (busybox); el proyecto no incluye actuator
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/tasks || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    image: ${NEXUS_REGISTRY:-localhost:9080}/studytrack-frontend:${IMAGE_TAG:?Debe definir IMAGE_TAG}
    container_name: studytrack-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - product-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  product-network:
    driver: bridge
  cicd_network:
    external: true
